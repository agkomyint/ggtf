[workspace]
resolver = "2"
members = ["crates/ggtf-core", "crates/ggtf-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# DSP tests are far too slow without optimization.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
