[package]
name = "ggtf-core"
description = "GGTF core: sound modem, framing, error correction, link layer, crypto and channel simulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reed-solomon = "0.2"
crc = "3"
rustfft = "6"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1"
